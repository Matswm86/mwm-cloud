name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: mwm-cloud
  # Secrets are unavailable on fork PRs; those builds fall back to debug so the
  # PR still compiles and tests, while every push to main is release-signed.
  HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Restore release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo -n "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          MWMCLOUD_KEYSTORE: ${{ runner.temp }}/release.keystore
          MWMCLOUD_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MWMCLOUD_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fork PRs, no signing secrets)
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        # Cache-busting filename: a fixed latest/<name>.apk URL gets served stale
        # by Android and by browsers, so the commit sha goes in the name.
        run: |
          set -e
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || apk=app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" "${APK_NAME}-${GITHUB_SHA:0:7}.apk"
          ls -la "${APK_NAME}-${GITHUB_SHA:0:7}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-apk
          path: ${{ env.APK_NAME }}-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update rolling "latest" release (main pushes)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (rolling)
          prerelease: true
          body: |
            Auto-built APK from the latest `main` commit (${{ github.sha }}).
            Release-signed; sideload install. Coming from a debug-signed build
            (0.1.0 era) requires uninstalling that app once — different app id,
            different signature.
          files: ${{ env.APK_NAME }}-*.apk
          fail_on_unmatched_files: true

      # The APK filename carries the commit sha (cache-busting, above), so any link
      # written into README.md by hand goes stale the moment the next build lands.
      # This step rewrites it to the APK this run just uploaded and pushes with the
      # skip-ci token, so the README link is always the newest build and the commit
      # does not trigger another build.
      #
      # NOTE: GitHub honours that token ANYWHERE in a commit message, including the
      # body. Do not quote it in an ordinary commit message describing this step, or
      # that push silently builds nothing and the README is never bumped.
      - name: Point README at the APK this build produced (main pushes)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="${APK_NAME}-${GITHUB_SHA:0:7}.apk"
          # Work off the current tip of main rather than this run's checkout, so a
          # concurrent push loses the race loudly instead of silently reverting main.
          git checkout -- . 2>/dev/null || true
          git fetch --depth=1 origin main
          git checkout -B _readme_bump FETCH_HEAD
          python3 - "$APK" <<'EOF'
          import re, sys
          apk = sys.argv[1]
          s = open('README.md', encoding='utf-8').read()
          out = re.sub(r'mwm-cloud-[0-9a-f]{7,40}\.apk', apk, s)
          open('README.md', 'w', encoding='utf-8').write(out)
          print('README unchanged' if out == s else 'README -> ' + apk)
          EOF
          if git diff --quiet -- README.md; then
            echo "README already points at ${APK}"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "README: download link -> ${APK} [skip ci]"
          # Losing the race just means the next build corrects it; never fail here.
          git push origin _readme_bump:main \
            || echo "push rejected (main moved) - the next build will correct the README"

      - name: Create tagged release (vX.Y.Z tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            MWM Cloud ${{ github.ref_name }}. Sideload, release-signed.
          files: ${{ env.APK_NAME }}-*.apk
          fail_on_unmatched_files: true
